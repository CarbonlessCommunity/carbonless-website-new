<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f2e21" />
    <title>Carbonless Community — Reduce your carbon footprint, together</title>
    <meta
      name="description"
      content="Carbonless Community helps groups of like-minded people execute easy, thoughtful measures that reduce their carbon footprint — and save money doing it."
    />
    <meta property="og:title" content="Carbonless Community" />
    <meta
      property="og:description"
      content="A collection of individuals working cooperatively to reduce greenhouse gas emissions."
    />
    <meta property="og:type" content="website" />
    <!-- Crawlers don't resolve relative og:image, so this stays absolute. 1200x630. -->
    <meta property="og:image" content="https://www.carbonlesscommunity.com/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Sets the theme class before first paint. `useTheme` applies it too, but
      // only in an effect — after React has mounted and the browser has already
      // painted a light page, which dark-mode visitors see as a white flash.
      // Keep the storage key and the OS fallback identical to src/lib/hooks.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem('cc-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* private mode: fall through to the light default */
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
